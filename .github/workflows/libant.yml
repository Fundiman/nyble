name: libant

# Builds a static libant.a (Ant Silver + stdlib) for x86_64-w64-mingw32 using
# clang from MSYS2 CLANG64. No MSVC anywhere: CLANG64 is clang with the
# mingw-w64/UCRT sysroot, and the resulting archive links with plain
# `gcc/clang file.c libant.a -lws2_32 ...` on the host.
#
# Artifact: libant-mingw64  ->  libant.a + ant.h + dist headers

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/libant.yml"
      - "third_party/ant"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Disable Defender real-time scanning
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Checkout (with Ant submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup clang + mingw-w64 (CLANG64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-llvm-tools
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-meson
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-nodejs
            git
            jq
            rsync

      - name: Materialise the libant/meson symlink
        # The repo stores packages/libant/meson as a symlink to ../../meson.
        # Windows checkout turns that into a text file; meson then can't
        # subdir() it. A copy is logically identical for meson's resolver.
        run: |
          rm -f packages/libant/meson
          cp -r meson packages/libant/meson

      - name: Fetch vendored subprojects
        run: |
          cd packages/libant
          bash scripts/setup.sh

      - name: Build libant
        env:
          LIBANT_CC: clang
          LIBANT_CXX: clang++
          CC: clang
          CXX: clang++
        run: |
          cd packages/libant
          bash scripts/compile.sh
          bash scripts/bundle.sh

      - name: Show artifact
        run: |
          ls -lh packages/libant/dist/

      - name: Upload libant.a
        uses: actions/upload-artifact@v4
        with:
          name: libant-mingw64
          path: packages/libant/dist/
          if-no-files-found: error
