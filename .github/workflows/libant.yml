name: libant

# Builds a static libant.a (Ant Silver + stdlib + vendored deps) for
# x86_64-w64-mingw32 using clang from MSYS2 UCRT64. No MSVC anywhere:
# UCRT64 clang targets mingw-w64/UCRT with libstdc++ ABI.
#
# Artifact: libant-mingw64  ->  lib/libant.a, include/ant.h, include/ant/...,
#                               lib/pkgconfig/libant.pc

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/libant.yml"
      - "third_party/ant"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Disable Defender real-time scanning
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Checkout (with Ant submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup clang + mingw-w64 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-llvm-tools
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-nodejs
            make
            git
            jq

      - name: Add mbedTLS backend to Ant
        # Upstream still hard-wires BoringSSL; this patch adds the
        # tls_backend=mbedtls option using tlsuv's existing mbedTLS engine.
        run: git apply --directory=third_party/ant patches/libant-mbedtls.patch

      - name: Fetch vendored subprojects (no BoringSSL)
        # Meson's parallel downloader deadlocks on Windows NTFS
        # (OSError errno 36); serial (-j 1) is slow but reliable.
        # BoringSSL is skipped entirely: not downloaded, not built.
        run: |
          cd third_party/ant
          wraps=$(for w in vendor/*.wrap; do
            n=$(basename "$w" .wrap)
            [ "$n" != boringssl ] && printf '%s ' "$n"
          done)
          for attempt in 1 2 3; do
            meson subprojects download -j 1 $wraps && break
            echo "attempt $attempt failed, retrying..."
            sleep 15
          done

      - name: Build libant embed dist
        env:
          CC: clang
          CXX: clang++
        run: |
          cd third_party/ant
          meson setup build-embed --prefer-static -Db_lto=false -Dc_std=gnu2x -Dtls_backend=mbedtls
          meson compile -C build-embed embed

      - name: Build NybleJS smoke
        run: |
          make -C NybleJS ANT_DIR=../third_party/ant/build-embed/libant CC=clang CXX=clang++ -j4
          ./NybleJS/njs -c "console.log(1+1)"
          ./NybleJS/njs -c "console.log(typeof Nyble)"
          ./NybleJS/njs --meow | head -1

      - name: Show artifact
        run: |
          ls -lh third_party/ant/build-embed/libant/lib/
          ls third_party/ant/build-embed/libant/include/

      - name: Upload libant.a
        uses: actions/upload-artifact@v4
        with:
          name: libant-mingw64
          path: third_party/ant/build-embed/libant/
          if-no-files-found: error
