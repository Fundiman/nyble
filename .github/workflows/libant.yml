name: libant

# Builds a static libant.a (Ant Silver + stdlib + vendored deps) for
# x86_64-w64-mingw32 using clang from MSYS2 CLANG64. No MSVC anywhere:
# CLANG64 is clang with the mingw-w64/UCRT sysroot.
#
# Artifact: libant-mingw64  ->  lib/libant.a, include/ant.h, include/ant/...,
#                               lib/pkgconfig/libant.pc

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/libant.yml"
      - "third_party/ant"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Disable Defender real-time scanning
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Checkout (with Ant submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup clang + mingw-w64 (CLANG64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-llvm-tools
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-meson
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-nodejs
            git
            jq

      - name: Fetch vendored subprojects
        # Meson's parallel downloader deadlocks on Windows NTFS
        # (OSError errno 36); serial (-j 1) is slow but reliable.
        run: |
          cd third_party/ant
          for attempt in 1 2 3; do
            meson subprojects download -j 1 && break
            echo "attempt $attempt failed, retrying..."
            sleep 15
          done

      - name: Build libant embed dist
        env:
          CC: clang
          CXX: clang++
        run: |
          cd third_party/ant
          meson setup build-embed --prefer-static -Db_lto=false -Dc_std=gnu2x
          meson compile -C build-embed embed

      - name: Show artifact
        run: |
          ls -lh third_party/ant/build-embed/libant/lib/
          ls third_party/ant/build-embed/libant/include/

      - name: Upload libant.a
        uses: actions/upload-artifact@v4
        with:
          name: libant-mingw64
          path: third_party/ant/build-embed/libant/
          if-no-files-found: error
